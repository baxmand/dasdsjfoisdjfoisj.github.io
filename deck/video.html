<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#08080b; --card:#141419; --pink:#ff2e8d; --pink2:#ff6fb0; --white:#fff;
  --text:#e9e9ee; --mute:#9a9aa4; --serif:Georgia,"Times New Roman",serif;
  --sans:Arial,Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--text)}
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:#08080b}
.glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
.g1{width:900px;height:900px;background:#ff1e8f;top:-260px;right:-160px;animation:drift1 26s ease-in-out infinite alternate}
.g2{width:760px;height:760px;background:#b3005f;bottom:-280px;left:-180px;opacity:.4;animation:drift2 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-140px,120px) scale(1.15)}}
@keyframes drift2{to{transform:translate(160px,-100px) scale(1.1)}}

#stage{position:fixed;inset:0;z-index:2}
.scene{position:absolute;inset:0;display:flex;align-items:center;gap:70px;padding:120px 130px;
  opacity:0;transform:scale(1.03);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform 1.2s cubic-bezier(.2,.7,.2,1)}
.scene.show{opacity:1;transform:none}
.scene.leave{opacity:0;transform:scale(.985);transition:opacity .8s ease,transform .8s ease}
.scene.rev{flex-direction:row-reverse}

.col{flex:1;min-width:0}
.media{width:600px;height:820px;flex:none;border-radius:22px;overflow:hidden;position:relative;
  border:1px solid rgba(255,46,141,.45);box-shadow:0 30px 90px rgba(0,0,0,.5)}
.media img,.media video{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.media .kb{animation:kb 15s ease-out both}
@keyframes kb{from{transform:scale(1.18) translate(2%,-2%)}to{transform:scale(1)}}
.media::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.5))}

.kick{display:flex;align-items:center;gap:.7em;font-size:20px;font-weight:700;letter-spacing:5px;color:var(--pink2);text-transform:uppercase}
.kick::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--pink)}
h2{font-family:var(--serif);font-weight:700;font-size:60px;line-height:1.05;color:#fff;margin:22px 0 30px}
.lead{font-size:27px;line-height:1.5;color:var(--text);max-width:820px}
.chip{display:inline-block;margin-top:26px;padding:14px 24px;border-radius:40px;background:rgba(255,46,141,.14);
  border:1px solid rgba(255,46,141,.5);color:var(--pink2);font-weight:700;font-size:22px}
.rows{margin-top:16px}
.row{display:flex;gap:20px;margin-top:26px;align-items:flex-start;max-width:860px}
.row .n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;font-family:var(--serif)}
.row .n.chk{font-size:22px}
.row b{font-family:var(--serif);font-size:26px;color:#fff;font-weight:700}
.row p{font-size:22px;color:#c6c6cd;line-height:1.4;margin-top:4px}
.cards{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.pcard{flex:1 1 240px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px}
.pcard .t{font-family:var(--serif);font-size:28px;color:#fff}
.pcard .s{font-size:19px;color:#c2c2c8;margin-top:8px;line-height:1.35}
.note{margin-top:26px;font-size:19px;color:var(--mute);font-style:italic}
.big{font-family:var(--serif);font-weight:700;color:#fff;line-height:.95}
.tags{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;max-width:820px}
.tag{padding:10px 18px;border-radius:30px;border:1px solid rgba(255,255,255,.18);color:#dcdce2;font-weight:700;font-size:19px}

/* staggered reveal */
.r{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.scene.show .r{opacity:1;transform:none}
.d1{transition-delay:.15s}.d2{transition-delay:.3s}.d3{transition-delay:.45s}.d4{transition-delay:.6s}
.d5{transition-delay:.75s}.d6{transition-delay:.9s}.d7{transition-delay:1.05s}.d8{transition-delay:1.2s}
.media.r{transform:translateY(0) scale(1.04)}
.scene.show .media.r{transform:none}

/* chrome */
#wm{position:fixed;top:44px;left:56px;z-index:5;font-family:var(--serif);font-size:30px;letter-spacing:1px;color:#fff}
#wm b{color:var(--pink2)}
#chap{position:fixed;top:50px;right:60px;z-index:5;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--pink2)}
#pbar{position:fixed;left:0;bottom:0;height:5px;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2));z-index:6}

/* center scenes (intro/outro) */
.scene.center{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0}
.scene.center .mono{font-family:var(--serif);font-weight:700;font-size:200px;line-height:1;color:#fff}
.scene.center .mono span{color:var(--pink2)}
.scene.center .subm{margin-top:20px;font-size:26px;letter-spacing:6px;font-weight:700;color:var(--pink2);text-transform:uppercase}
.scene.center .tl{margin-top:26px;font-size:30px;color:var(--text)}
.scene.center h2{font-size:88px}
</style>
</head>
<body>
<div id="bgwrap"><div class="glow g1"></div><div class="glow g2"></div></div>
<div id="wm">AS<b>.</b></div>
<div id="chap"></div>
<div id="stage"></div>
<div id="pbar"></div>

<script>
const A='assets/', M='site/media/';
function media(type,src){ if(!type) return '';
  const inner = type==='video'
    ? `<video class="kb" src="${M}${src}" autoplay muted loop playsinline></video>`
    : `<img class="kb" src="${A}${src}">`;
  return `<div class="media r d1">${inner}</div>`;
}
function scene(o){
  const cls='scene'+(o.center?' center':'')+(o.rev?' rev':'');
  const body = o.center ? o.html : `<div class="col">${o.html}</div>${media(o.mtype,o.msrc)}`;
  return {cls, body, dur:o.dur};
}

const SC=[
  // 0 intro
  scene({center:true,dur:3600,html:`
    <div class="mono r">AS<span>.</span></div>
    <div class="subm r d2">Agency · Rare · Amplify</div>
    <div class="tl r d4">Продюсерский холдинг полного цикла</div>`}),

  // 1 who
  scene({dur:8200,mtype:'img',msrc:'p-house-coast.png',html:`
    <div class="kick r">Кто мы</div>
    <h2 class="r d1">Не агентство —<br>а продюсерский холдинг</h2>
    <div class="lead r d2">Мы выстраиваем работу на другом уровне: полноценный продюсерский проект, который занимается комплексным развитием моделей и масштабированием личного бренда.</div>
    <div class="chip r d4">Комплексное развитие · рост медийности · монетизация</div>`}),

  // 2 structure
  scene({dur:10500,rev:true,mtype:'img',msrc:'p-house-pool.png',html:`
    <div class="kick r">Структура</div>
    <h2 class="r d1">Три площадки — одна система</h2>
    <div class="cards">
      <div class="pcard r d2"><div class="t">AS Agency</div><div class="s">Флагман. Топы и медийные проекты.</div></div>
      <div class="pcard r d3"><div class="t">Rare</div><div class="s">Новички и модели с небольшим опытом.</div></div>
      <div class="pcard r d4"><div class="t">Amplify</div><div class="s">Начинающие блогеры и креаторы.</div></div>
    </div>
    <div class="note r d6">Rare &amp; Amplify (ex-AS Talent Nordic) — официальная регистрация в Финляндии и на Кипре.</div>`}),

  // 3 funnel
  scene({dur:9000,mtype:'img',msrc:'p-qimmah.png',html:`
    <div class="kick r">Воронка</div>
    <h2 class="r d1">Ни один скаут<br>не уходит ни с чем</h2>
    <div class="lead r d2">Приводи любую перспективную модель. Не проходит во флагман AS — заводим в Rare или Amplify.</div>
    <div class="chip r d4">Скаутинг не пропадает — твоя комиссия сохраняется</div>`}),

  // 4 AS criteria
  scene({dur:9600,rev:true,mtype:'img',msrc:'p-house-villa.png',html:`
    <div class="kick r">AS Agency · отбор</div>
    <h2 class="r d1">Строгий отбор,<br>крупные инвестиции</h2>
    <div class="rows">
      <div class="row r d2"><div class="n">1</div><div><b>Опытные модели</b><p>Текущий доход на OnlyFans / Fansly — от $10 000 в месяц.</p></div></div>
      <div class="row r d3"><div class="n">2</div><div><b>Медийные блогеры</b><p>Запускаем с нуля и выстраиваем полноценную монетизацию.</p></div></div>
    </div>
    <div class="chip r d5">Ориентир — $10 000 уже в первый месяц (или ×2, если старт выше)</div>`}),

  // 5 rare/amplify criteria
  scene({dur:8000,mtype:'img',msrc:'p-caprice.png',html:`
    <div class="kick r">Rare &amp; Amplify · отбор</div>
    <h2 class="r d1">Ставка на потенциал</h2>
    <div class="rows">
      <div class="row r d2"><div class="n chk">✓</div><div><b>С нуля, без опыта</b><p>Но с хорошим потенциалом.</p></div></div>
      <div class="row r d3"><div class="n chk">✓</div><div><b>Небольшой опыт</b><p>Уже есть старт на OnlyFans / Fansly.</p></div></div>
      <div class="row r d4"><div class="n chk">✓</div><div><b>Начинающие блогеры</b><p>Медийные модели и креаторы в начале пути.</p></div></div>
    </div>`}),

  // 6 formats
  scene({dur:8200,rev:true,mtype:'img',msrc:'p-eli.png',html:`
    <div class="kick r">Форматы контента</div>
    <h2 class="r d1">Монетизируем<br>любой формат</h2>
    <div class="rows">
      <div class="row r d2"><div class="n">H</div><div><b>Explicit / Hard</b><p>Классический откровенный контент.</p></div></div>
      <div class="row r d3"><div class="n">S</div><div><b>No-nude / Aesthetic / Soft</b><p>Эстетичный формат без хард-контента — как у Лизы Василенко.</p></div></div>
    </div>
    <div class="note r d5">Наши менеджеры эффективно монетизируют и не-откровенные сегменты.</div>`}),

  // 7 growth
  scene({dur:12500,mtype:'video',msrc:'house-villa.mp4',html:`
    <div class="kick r">Рост дохода</div>
    <h2 class="r d1">За счёт чего растём</h2>
    <div class="rows">
      <div class="row r d2"><div class="n">1</div><div><b>Команда и сервис</b><p>Менеджеры, чаттеры и аналитики на каждом проекте.</p></div></div>
      <div class="row r d3"><div class="n">2</div><div><b>Контент-хаусы</b><p>Раз в квартал: коллаборации и обмен аудиторией.</p></div></div>
      <div class="row r d4"><div class="n">3</div><div><b>Органический трафик</b><p>OFTV, SFS, Reddit, Instagram, X, TikTok, YouTube, Fansly. Без платного спама.</p></div></div>
      <div class="row r d5"><div class="n">4</div><div><b>Системный подход</b><p>Чёткий контент-план и график без выгорания.</p></div></div>
    </div>`}),

  // 8 evaluation
  scene({dur:9800,rev:true,mtype:'img',msrc:'p-house-snow.png',html:`
    <div class="kick r">Оценка проекта</div>
    <h2 class="r d1">Ответ за 24–48 часов</h2>
    <div class="lead r d2" style="margin-bottom:6px">Что нужно от скаута / модели:</div>
    <div class="rows">
      <div class="row r d3"><div class="n chk">✓</div><div><b>Статистика OnlyFans / Fansly</b><p>За последние 2–3 месяца, если есть опыт.</p></div></div>
      <div class="row r d4"><div class="n chk">✓</div><div><b>Статистика соцсетей</b><p>Instagram, TikTok и другие площадки с аудиторией.</p></div></div>
      <div class="row r d5"><div class="n chk">✓</div><div><b>Динамика и география</b><p>Подписки / отписки и ключевые страны трафика.</p></div></div>
    </div>
    <div class="chip r d7">Аналитики определяют агентство: AS · Rare · Amplify</div>`}),

  // 9 trust
  scene({dur:6600,mtype:'img',msrc:'p-chloe.png',html:`
    <div class="kick r">Легальность</div>
    <h2 class="r d1">Международный статус</h2>
    <div class="lead r d2">Официальная регистрация в Финляндии и на Кипре. Прозрачные условия и договор — не «однодневка».</div>
    <div class="tags">
      <div class="tag r d4">🇫🇮 Финляндия</div><div class="tag r d5">🇨🇾 Кипр</div><div class="tag r d6">Договор</div>
    </div>`}),

  // 10 outro
  scene({center:true,dur:6800,html:`
    <div class="subm r">Давайте работать</div>
    <h2 class="big r d1" style="margin-top:20px">Раскрой свой<br>потенциал с AS</h2>
    <div class="tl r d3">Telegram @AS_Agency&nbsp; ·&nbsp; WhatsApp +1 (646) 596 6014</div>
    <div class="tl r d4" style="margin-top:8px;color:var(--pink2)">astalentagency.com</div>`}),
];

const stage=document.getElementById('stage');
const chap=document.getElementById('chap');
const pbar=document.getElementById('pbar');
const total=SC.reduce((a,s)=>a+s.dur,0)+900;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function run(){
  // progress bar over full duration
  pbar.style.transition=`width ${total}ms linear`;
  requestAnimationFrame(()=>{pbar.style.width='100%';});
  let prev=null;
  for(let i=0;i<SC.length;i++){
    const s=SC[i];
    const el=document.createElement('div'); el.className=s.cls; el.innerHTML=s.body;
    stage.appendChild(el);
    chap.textContent=String(i+1).padStart(2,'0')+' / '+String(SC.length).padStart(2,'0');
    void el.offsetWidth;
    el.classList.add('show');
    if(prev){ const p=prev; p.classList.add('leave'); setTimeout(()=>p.remove(),1000); }
    prev=el;
    await wait(s.dur);
  }
  if(prev) prev.classList.add('leave');
  await wait(1000);
  document.body.setAttribute('data-done','1');
  window.__done=true;
}
addEventListener('load',()=>setTimeout(run,300));
</script>
</body>
</html>
