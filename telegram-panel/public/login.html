<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — Панель чатов</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light d-flex align-items-center" style="min-height:100vh;">
<div class="container" style="max-width:380px;">
  <h3 class="mb-4 text-center">Вход в панель</h3>
  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label">Логин</label>
      <input type="text" class="form-control" id="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Пароль</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div id="error" class="text-danger small mb-3"></div>
    <button type="submit" class="btn btn-primary w-100">Войти</button>
  </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
