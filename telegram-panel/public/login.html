<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Telegram — вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-card__logo">➤</div>
    <h1>Telegram</h1>
    <p class="login-card__sub">Войдите, чтобы продолжить</p>
    <form id="loginForm">
      <div class="login-field">
        <label class="form-label" for="username">Логин</label>
        <input type="text" class="form-control" id="username" required autofocus autocomplete="username">
      </div>
      <div class="login-field">
        <label class="form-label" for="password">Пароль</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password">
      </div>
      <div id="error" class="login-error"></div>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
  </div>
<script src="js/login.js"></script>
</body>
</html>
