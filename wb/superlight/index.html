*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#F2F5FA; --dim:#96A3B8; --acc:#4FB3FF; --acc2:#8FD3FF;
}
html,body{background:#05060A;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.stage{transform-origin:top center}
.card{
  position:relative;width:1440px;height:1920px;overflow:hidden;
  background:
    radial-gradient(1100px 900px at 50% 46%, rgba(79,179,255,.20), rgba(79,179,255,0) 62%),
    radial-gradient(900px 700px at 50% 8%, rgba(255,255,255,.09), rgba(255,255,255,0) 70%),
    linear-gradient(163deg,#12151C 0%,#0A0C11 46%,#070809 78%,#0C0F15 100%);
}
/* geometric facets, low contrast */
.facet{position:absolute;background:linear-gradient(140deg,rgba(255,255,255,.055),rgba(255,255,255,0) 60%);}
.f1{inset:-320px auto auto -260px;width:1100px;height:1100px;transform:rotate(38deg);border-top:2px solid rgba(255,255,255,.07)}
.f2{inset:auto -300px -280px auto;width:1000px;height:1000px;transform:rotate(38deg);border-top:2px solid rgba(79,179,255,.16);
    background:linear-gradient(140deg,rgba(79,179,255,.10),rgba(79,179,255,0) 55%)}
.f3{inset:620px auto auto -180px;width:520px;height:520px;transform:rotate(38deg);border-bottom:2px solid rgba(255,255,255,.05)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 78% at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,.62) 100%)}
.noise{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}

.inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:86px 84px 148px}

/* ── header ── */
.top{display:flex;justify-content:space-between;align-items:center}
.pill{display:flex;align-items:center;gap:14px;height:62px;padding:0 30px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  font-size:26px;font-weight:700;letter-spacing:.16em;color:#DCE5F2;backdrop-filter:blur(4px)}
.pill .g{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--acc);color:#06121D;font-size:22px;font-weight:800;letter-spacing:0}
.pill.acc{border-color:rgba(79,179,255,.42);background:rgba(79,179,255,.12);color:var(--acc2)}

.title{margin-top:64px;text-align:center}
.eyebrow{font-size:40px;font-weight:800;letter-spacing:.5em;color:var(--acc);text-indent:.5em}
.wordmark{margin-top:16px;font-size:196px;line-height:.9;font-weight:800;letter-spacing:-.035em;
  background:linear-gradient(180deg,#FFFFFF 18%,#B9C6D9 96%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 12px 40px rgba(79,179,255,.28))}
.sub{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:22px;
  font-size:29px;font-weight:700;letter-spacing:.22em;color:#A9B6C9}
.sub i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block;font-style:normal}

/* ── hero ── */
.hero{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
.halo{position:absolute;width:940px;height:940px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,195,255,.26) 0%,rgba(79,179,255,.09) 42%,rgba(79,179,255,0) 68%)}
.ring{position:absolute;width:820px;height:820px;border-radius:50%;border:1.5px solid rgba(255,255,255,.09)}
.ring.r2{width:1080px;height:1080px;border-color:rgba(255,255,255,.05)}
.stack{position:relative;display:flex;flex-direction:column;align-items:center}
.shot{position:relative;height:838px;filter:drop-shadow(0 40px 55px rgba(0,0,0,.70)) drop-shadow(0 0 100px rgba(79,179,255,.20))}
.base{position:relative;margin-top:26px;width:640px;height:2px;
  background:linear-gradient(90deg,rgba(120,195,255,0),rgba(150,210,255,.75) 50%,rgba(120,195,255,0));
  box-shadow:0 0 26px 3px rgba(79,179,255,.35)}
.base::before{content:'';position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  width:430px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.75),rgba(0,0,0,0) 72%);filter:blur(12px);z-index:-1}

/* ── sensor strip ── */
.strip{display:flex;align-items:center;justify-content:center;gap:20px;margin:26px 0 36px;
  font-size:28px;font-weight:800;letter-spacing:.2em;color:#C9D6E8}
.strip .ln{flex:1;height:1.5px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22))}
.strip .ln.r{background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0))}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tile{position:relative;padding:34px 30px 32px;border-radius:30px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.13);
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 24px 50px rgba(0,0,0,.45)}
.tile::after{content:'';position:absolute;left:30px;right:30px;top:0;height:2px;
  background:linear-gradient(90deg,rgba(79,179,255,0),rgba(79,179,255,.85),rgba(79,179,255,0))}
.tile svg{width:44px;height:44px;stroke:var(--acc);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.num{margin-top:16px;font-size:88px;line-height:1;font-weight:800;letter-spacing:-.03em;color:#fff;white-space:nowrap}
.num span{font-size:44px;font-weight:700;color:var(--acc2);margin-left:8px;letter-spacing:0}
.lbl{margin-top:14px;font-size:25px;font-weight:700;line-height:1.28;letter-spacing:.05em;color:#94A2B7;text-transform:uppercase}
</style>
